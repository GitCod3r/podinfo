name: cra-evidence
on: [push]
permissions:
  contents: read
  id-token: write                 # keyless signing via GitHub OIDC
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: GitCod3r/cra-evidence/github-action@v0.2.1
        with:
          image_ref: docker.io/library/debian:12.0   # section 8: old image, KEV-listed CVEs expected
          product_name: podinfo
